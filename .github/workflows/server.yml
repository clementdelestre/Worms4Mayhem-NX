name: server

on:
  push:
    branches: [main]
    paths: [server/**, .github/workflows/server.yml]
  pull_request:
    paths: [server/**, .github/workflows/server.yml]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
        working-directory: server
      - run: rustup target add x86_64-unknown-linux-musl && cargo build --release --locked --target x86_64-unknown-linux-musl
        working-directory: server
      # Rolling `server-latest` release + `amp-templates` branch (AMP reads templates from a repo root).
      - name: Publish the binary and the AMP template
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp server/target/x86_64-unknown-linux-musl/release/worms4nx-server worms4nx-server-linux-x86_64
          gh release view server-latest >/dev/null 2>&1 \
            || gh release create server-latest --prerelease --target "$GITHUB_SHA" --title "Server (latest main)" --notes "Built from main by the server workflow."
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/server-latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release upload server-latest worms4nx-server-linux-x86_64 --clobber
          cd server/amp && git init -q -b amp-templates && git add . \
            && git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "AMP template from $GITHUB_SHA" \
            && git push -qf "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" HEAD:amp-templates
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/worms4nx-server:latest
            ghcr.io/${{ github.repository_owner }}/worms4nx-server:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
